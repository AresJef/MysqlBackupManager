[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysql-backup-manager"
version = "0.1.0"
description = "Production-ready Python library for MySQL backup and restore using native MySQL client tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mysql-backup-manager contributors" }]
keywords = ["mysql", "backup", "restore", "mysqldump", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "croniter>=2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]


[tool.hatch.build.targets.wheel]
packages = ["mysql_backup_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

